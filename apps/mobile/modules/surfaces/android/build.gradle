plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'ai.sixpm'
version = '1.0.0'

// The domain bundle the iOS extensions run, generated by tools/scripts/generate-native.ts: bank
// alerts are read with it on Android too, so Kotlin never holds its own copy of a money rule.
def domainAssets = layout.buildDirectory.dir('generated/domain-assets')
def copyDomainBundle = tasks.register('copyDomainBundle', Copy) {
  from("${projectDir}/../../../targets/_shared/domain-native.js")
  into(domainAssets)
}

android {
  namespace "ai.sixpm.surfaces"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
  sourceSets {
    main.assets.srcDirs += domainAssets
  }
}

tasks.named('preBuild') { dependsOn(copyDomainBundle) }

dependencies {
  implementation 'androidx.core:core-ktx:1.17.0'
  implementation 'androidx.javascriptengine:javascriptengine:1.1.1'
}
